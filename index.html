<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03070d">
<title>D&D Pulse — Hero prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="hero" id="hero" aria-label="D&D Pulse">
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
  <div class="orbital orbital-a" aria-hidden="true"></div><div class="orbital orbital-b" aria-hidden="true"></div>
  <div class="pulse-origin" id="pulseOrigin" aria-hidden="true"></div>
  <div class="copy" id="copy" aria-live="polite">
    <div class="message brand active"><span class="chrome">D&D</span> <span class="cyan">PULSE</span></div>
    <div class="message values"><span>INNOVATION</span><i>•</i><span>MODERNITÉ</span><i>•</i><span>CRÉATIVITÉ</span></div>
    <div class="message tagline">DONNEZ UNE PREMIÈRE<br><strong>IMPULSION</strong> À VOS PROJETS</div>
  </div>
  <div class="status"><span class="dot"></span> CREATIVE SYSTEM / ONLINE</div>
  <a class="discover" href="#site"><span>DÉCOUVRIR</span><b>↓</b></a>
</section>
<main id="site">
  <nav><div class="mini-brand">D&D <em>PULSE</em></div><div class="links"><a href="#">Accueil</a><a href="#">Expériences</a><a href="#">Projets</a><a href="#">Contact</a></div></nav>
  <section class="placeholder"><p>LE SITE COMMENCE ICI</p><h1>Des idées qui prennent <span>vie.</span></h1><p class="lead">Prototype visuel : le contenu sous la bannière sera travaillé ensuite.</p></section>
</main>
<script src="app.js"></script>
</body></html>
